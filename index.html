<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remaintune Server Status</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #1e1e1e; display: inline-block; padding: 25px 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .status-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background-color: #2ea44f; }
        .offline { background-color: #cb2431; }
        .server-ip { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Minefort Status</h2>
        <p class="server-ip">remaintune.minefort.com:19132</p>
        <p>
            <span id="dot" class="status-dot offline"></span>
            <span id="status">Checking server status...</span>
        </p>
        <p id="players">Players: --/--</p>
    </div>

    <script>
        // Server details
        const SERVER_HOST = "remaintune.minefort.com";
        const SERVER_PORT = "19132";

        async function checkMinefortStatus() {
            try {
                // Notice /bedrock/ in the endpoint for Bedrock/Geyser servers
                const response = await fetch(`https://api.mcsrvstat.us/bedrock/3/${SERVER_HOST}:${SERVER_PORT}`);
                const data = await response.json();

                const statusText = document.getElementById("status");
                const dot = document.getElementById("dot");
                const playersText = document.getElementById("players");

                if (data.online) {
                    dot.className = "status-dot online";
                    statusText.innerText = "ONLINE";
                    
                    // Show player counts if available
                    if (data.players) {
                        playersText.innerText = `Players: ${data.players.online}/${data.players.max}`;
                    } else {
                        playersText.innerText = "Server is online!";
                    }
                } else {
                    dot.className = "status-dot offline";
                    statusText.innerText = "OFFLINE (or starting up)";
                    playersText.innerText = "Players: 0";
                }
            } catch (error) {
                console.error("Error fetching server status:", error);
                document.getElementById("status").innerText = "Error loading status";
            }
        }

        // Run check on page load
        checkMinefortStatus();

        // Auto-refresh every 60 seconds
        setInterval(checkMinefortStatus, 60000);
    </script>
</body>
</html>
